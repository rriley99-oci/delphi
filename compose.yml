services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DELPHI_DATABASE_URL: postgresql+psycopg://delphi:delphi@postgres:5432/delphi
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delphi
      POSTGRES_USER: delphi
      POSTGRES_PASSWORD: delphi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delphi -d delphi"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - delphi-postgres-data:/var/lib/postgresql/data

volumes:
  delphi-postgres-data:
