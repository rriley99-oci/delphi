identity:
  database: delphi_source
  schema: sales
  table: order_items
load_strategy: incremental
description: Incremental order line items keyed by order and line number.
time_semantics:
  freshness_column: created_at
  append_column: created_at
generator_hints:
  primary_key: order_item_id
  child_of: sales.orders
  items_per_order: 2
  supports_rules:
    - freshness
    - row_count_minimum
    - custom_sql_orphan_item_check
